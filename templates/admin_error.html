{% extends "base.html" %}
{% block title %}后台暂时不可用｜信跃{% endblock %}
{% block body_class %}admin-body{% endblock %}
{% block body %}
<main class="admin-auth-wrap">
  <section class="card admin-auth-card">
    <div class="brand compact">
      <span class="brand-mark" aria-hidden="true">信跃</span>
      <span class="brand-sub">研究数据后台</span>
    </div>
    <h1>暂时无法读取数据</h1>
    <p class="lead">{{ message }}</p>
    <div class="admin-actions">
      <a class="button button-primary" href="{{ url_for('admin.dashboard') }}">重试</a>
      <form method="post" action="{{ url_for('admin.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
        <button class="button button-quiet" type="submit">退出登录</button>
      </form>
    </div>
  </section>
</main>
{% endblock %}
