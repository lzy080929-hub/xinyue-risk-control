{% extends "base.html" %}
{% block title %}设置本机管理员｜信跃{% endblock %}
{% block body %}
<main class="admin-auth-wrap"><section class="card admin-auth-card">
<h1>设置本机管理员</h1><p>设置后可查看填写进度、核对记录和导出数据。密码只保存为哈希，不会保存明文。</p>
{% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
<form method="post" class="auth-form">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
<div class="field"><label for="username">用户名</label><input id="username" name="username" required pattern="[A-Za-z0-9_-]{3,50}" autocomplete="username" /></div>
<div class="field"><label for="password">密码（至少12位）</label><input id="password" name="password" type="password" minlength="12" maxlength="200" required autocomplete="new-password" /></div>
<div class="field"><label for="confirm">再次输入密码</label><input id="confirm" name="confirm" type="password" minlength="12" maxlength="200" required autocomplete="new-password" /></div>
<button class="button button-primary" type="submit">保存并前往登录</button>
</form><p class="field-help">此设置页仅在尚未配置管理员的本机开发环境开放，正式部署使用托管平台环境变量。</p>
</section></main>
{% endblock %}
